version: '3'

silent: true
 
tasks:
  default:
    cmds:
      - task: deploy:curie-local-owl

  deploy:curie-local-owl:
    desc: Deploy curie using the local minerva_owl-setup checkout
    vars:
      LOCAL_OWL: /home/user/work/minerva/minerva_owl-setup
    preconditions:
      - sh: test -e {{.LOCAL_OWL}}/flake.nix
        msg: "Local Owl checkout not found at {{.LOCAL_OWL}}"
    cmds:
      - task: deploy:curie
        vars:
          FLAKE_INPUT_OVERRIDES: --override-input minerva_owl_setup path:{{.LOCAL_OWL}}

  deploy:* :
    desc: Deploy to a specific target
    vars:
      TARGET: '{{index .MATCH 0}}'
      TARGET_HOST: '{{.TARGET_HOST| default .TARGET}}'
      HOSTNAME:
        sh: "hostname"
      ALLOWED_TARGETS: # Dynamically get allowed targets to use in precondition
        sh: "nix flake show --json 2>/dev/null | jq -r '.nixosConfigurations | keys[]'"
      NIX_REBUILD_CMD: nixos-rebuild switch --flake .#{{.TARGET}} --print-build-logs --no-reexec {{.FLAKE_INPUT_OVERRIDES | default ""}}
    preconditions:
      - sh: echo '{{.ALLOWED_TARGETS}}' | grep -q '^{{.TARGET}}$'
        msg: "Target [{{.TARGET}}] is not in the list of allowed targets: [{{.ALLOWED_TARGETS}}]"
    cmds:
      - echo "    🚀 Deploying flake .#{{.TARGET}} to host {{.TARGET_HOST}}..."
      - cmd: sudo {{.NIX_REBUILD_CMD}}
        if: '{{eq .TARGET_HOST .HOSTNAME}}'
      - cmd: '{{.NIX_REBUILD_CMD}} --target-host "{{.TARGET_HOST}}" --build-host "{{.TARGET_HOST}}" --sudo'
        if: '{{ne .TARGET_HOST .HOSTNAME}}'
      - cmd: echo "🎉 Deployment to {{.TARGET_HOST}} completed successfully! 🎉"
  
  test:
    desc: Run tests
    cmds:
      - bash home/todo/greeting.test.sh
      - bash home/todo/otto-mate.test.sh

  update:
    desc: Full system update
    prompt: This will update *everything* in your systems. Do you want to continue?
    cmds:
      - nix flake update

  clean:
    desc: Remove older generations and unused packages
    cmds:
      # Delete all generations older than 7 days
      - sudo nix profile wipe-history --older-than 7d --profile /nix/var/nix/profiles/system
      # Garbage collect unused packages
      - sudo nix-collect-garbage --delete-old
      # Optional: Clean home-manager generations
      - nix-collect-garbage --delete-old
    
  upgrade:
    desc: Update and deploy all targets
    output: 'prefixed'
    deps:
      - update
    cmds:
      - task: deploy:all

  kwin_restart:
    desc: Restart KWin && Plasma
    cmds:
      - kwin_wayland --replace &
      - systemctl --user restart plasma-plasmashell

  reset_display:
    desc: Reset saved display/output config so KWin re-detects the preferred mode
    cmds:
      - rm -f ~/.config/kwinoutputconfig.json
      - echo "Removed kwinoutputconfig.json — log out/in (or run 'task kwin_restart') to re-detect."
  
  rekey_secrets:
    desc: Rekey secrets with agenix (in the private nixos-secrets repo)
    cmds:
      - cd ../nixos-secrets && agenix -r && git commit -am "rekey" && git push
      - nix flake update secrets

  new_install:
    desc: Fresh install on a new machine that is booted from a NixOS installer stick
    summary: |
      Usage:
        task new_install TARGET_HOST_IP_USER_ACCESSIBLE=<installer ip> CONFIG_NAME=<host> [EMPTY_USER_PASSWORD=y] [SKIP_ACTUAL_INSTALL=y]

      Prerequisite: hosts/<host>/ exists and is wired into flake.nix.
      SKIP_ACTUAL_INSTALL=y skips everything up to and including the first boot, for a machine that already runs the new config.
      EMPTY_USER_PASSWORD=y sets an empty local password for the user (SSH stays key-only).
    requires:
      vars:
        - name: TARGET_HOST_IP_USER_ACCESSIBLE
        - name: CONFIG_NAME
    vars:
      USER_ON_TARGET_HOST: '{{.USER_ON_TARGET_HOST | default "user"}}'
      INSTALLER_USER: '{{.INSTALLER_USER | default "root"}}'
      SKIP_ACTUAL_INSTALL: '{{.SKIP_ACTUAL_INSTALL | default "n"}}'
      EMPTY_USER_PASSWORD: '{{.EMPTY_USER_PASSWORD | default "n"}}'
      INSTALLER_SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      TARGET: '{{.USER_ON_TARGET_HOST}}@{{.TARGET_HOST_IP_USER_ACCESSIBLE}}'
      INSTALLER_TARGET: '{{.INSTALLER_USER}}@{{.TARGET_HOST_IP_USER_ACCESSIBLE}}'
      HOST_DIR: ./hosts/{{.CONFIG_NAME}}
    preconditions:
      - sh: test -f {{.HOST_DIR}}/configuration.nix
        msg: "{{.HOST_DIR}}/configuration.nix not found. Create the host and add it to flake.nix first."
    cmds:
      - cmd: |
          echo "Boot the target from the NixOS installer stick (UEFI entry, cable plugged in)."
          echo "On its console run 'sudo passwd root' and check the IP with 'ip -4 a'."
          read -p "Hit enter when the installer is up at {{.TARGET_HOST_IP_USER_ACCESSIBLE}} (you will be asked for the root password once) " -r
        if: '[ "{{.SKIP_ACTUAL_INSTALL}}" != "y" ]'
      - cmd: ssh-copy-id {{.INSTALLER_SSH_OPTS}} {{.INSTALLER_TARGET}}
        if: '[ "{{.SKIP_ACTUAL_INSTALL}}" != "y" ]'
      - cmd: nix run github:nix-community/nixos-anywhere -- --ssh-option StrictHostKeyChecking=no --ssh-option UserKnownHostsFile=/dev/null --phases kexec,disko,install --flake .#{{.CONFIG_NAME}} --print-build-logs {{.INSTALLER_TARGET}}
        if: '[ "{{.SKIP_ACTUAL_INSTALL}}" != "y" ]'
      - cmd: |
          read -p "Installed. Hit enter to reboot, then pull the installer stick as soon as the screen goes dark " -r
          ssh {{.INSTALLER_SSH_OPTS}} {{.INSTALLER_TARGET}} 'umount -R /mnt; reboot' || true
        if: '[ "{{.SKIP_ACTUAL_INSTALL}}" != "y" ]'
      - cmd: |
          echo "Waiting for {{.TARGET}} ..."
          until ssh -o BatchMode=yes -o ConnectTimeout=3 {{.INSTALLER_SSH_OPTS}} {{.TARGET}} true > /dev/null 2>&1; do sleep 5; done
          ssh-keygen -R {{.TARGET_HOST_IP_USER_ACCESSIBLE}} > /dev/null 2>&1 || true
          ssh -o StrictHostKeyChecking=accept-new {{.TARGET}} true
      - cmd: ssh {{.TARGET}} "sudo passwd -d {{.USER_ON_TARGET_HOST}}"
        if: '[ "{{.EMPTY_USER_PASSWORD}}" = "y" ]'
      - ssh {{.TARGET}} "sudo nixos-generate-config --no-filesystems --show-hardware-config" > {{.HOST_DIR}}/hardware-configuration.nix.new
      - mv {{.HOST_DIR}}/hardware-configuration.nix.new {{.HOST_DIR}}/hardware-configuration.nix
      - cmd: |
          HOST_KEY=$(ssh {{.TARGET}} 'cat /etc/ssh/ssh_host_ed25519_key.pub' | cut -d' ' -f1,2)
          echo
          echo "In the private nixos-secrets repo:"
          echo "  1. pubkeys_attrset.nix: add   {{.CONFIG_NAME}} = \"$HOST_KEY\";"
          echo "  2. secrets.nix: add {{.CONFIG_NAME}} to the 'inherit (import ./pubkeys_attrset.nix)' list and to 'general'"
          read -p "Hit enter when done " -r
      - task: rekey_secrets
      - task: deploy:{{.CONFIG_NAME}}
        vars: { TARGET_HOST: "{{.TARGET_HOST_IP_USER_ACCESSIBLE}}" }
